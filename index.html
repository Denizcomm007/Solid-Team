<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solid OS</title>



<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --h:220;
  --bg:#0b0d14; --fg:#f5f7ff; --muted:rgba(245,247,255,.65);
  --card:rgba(255,255,255,.08); --line:rgba(255,255,255,.18);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d14;--fg:#f5f7ff}}
:root[data-theme="dark"]{--bg:#0b0d14;--fg:#f5f7ff}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;
  background:
   radial-gradient(60% 60% at 20% 20%,hsl(var(--h) 80% 50% / .55),transparent 70%),
   radial-gradient(55% 55% at 80% 30%,hsl(calc(var(--h) + 50) 80% 55% / .45),transparent 70%),
   radial-gradient(60% 60% at 50% 90%,hsl(calc(var(--h) - 50) 80% 50% / .5),transparent 70%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.25) translate(-3%,4%)}}
main{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.brand{font-size:14px;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.dl{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;margin-top:8px}
.dl a{display:block;padding:14px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:16px;font-weight:600;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .2s,transform .2s}
.dl a:hover,.dl a:focus-visible{background:hsl(var(--h) 80% 55% / .45);transform:translateY(-2px);outline:none}

.tabs{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:7px 18px;border-radius:999px;cursor:pointer}
.tabs button.on{background:hsl(var(--h) 80% 55%);color:#fff}
.hello{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 56px);left:0;right:0;text-align:center;font-size:13px;color:var(--muted);pointer-events:none}
.hello button{pointer-events:auto;background:none;border:0;color:var(--fg);text-decoration:underline;font:inherit;cursor:pointer;padding:0 0 0 6px}

.forum{position:relative;z-index:1;height:100%;overflow:auto;padding:84px 16px 96px}
.wrap{max-width:720px;margin:0 auto}
/* forum motorunun renklerini siteye uydur */
#sx-forum.sxf{--bg:rgba(0,0,0,.28);--card:rgba(255,255,255,.09);--tx:var(--fg);--mut:var(--muted);--ac:hsl(var(--h) 80% 55%);--bd:var(--line);--new:hsl(var(--h) 80% 55% / .35)}
#sx-forum .sxf-card{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

.picker{position:fixed;z-index:2;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);
  display:flex;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--fg)}
.sw.auto{background:conic-gradient(#f43,#fb3,#4d6,#3bf,#74f,#f4a,#f43)}
.modal{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(5,6,10,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:20px}
.modal.show{display:flex}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.box h2{margin:0 0 6px;font-size:20px}
.box p{margin:0 0 16px;color:var(--muted);font-size:14px}
.box input{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--fg);font-size:16px}
.box input:focus{outline:2px solid hsl(var(--h) 80% 60%)}
.go{width:100%;padding:12px;border:0;border-radius:12px;background:hsl(var(--h) 80% 55%);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.err{color:#ff8a8a;font-size:13px;min-height:18px;margin:0 0 8px}

/* forum */
#vForum h2{margin:0;font-size:22px}
.f-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.f-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:left}
.f-card.click{cursor:pointer;transition:background .2s}
.f-card.click:hover{background:rgba(255,255,255,.13)}
.f-card input,.f-card textarea{width:100%;padding:11px 13px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--fg);font:inherit;font-size:16px;resize:vertical}
.f-card input:focus,.f-card textarea:focus{outline:2px solid hsl(var(--h) 80% 60%)}
.f-btn{border:0;border-radius:12px;background:hsl(var(--h) 80% 55%);color:#fff;font:inherit;font-size:15px;font-weight:600;padding:10px 16px;cursor:pointer}
.f-btn:disabled{opacity:.6}
.f-link{background:none;border:0;color:var(--fg);font:inherit;font-size:15px;cursor:pointer;padding:0;margin-bottom:12px}
.f-title{font-size:17px;font-weight:700;margin:0 0 4px;overflow-wrap:anywhere}
.f-meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.f-text{font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 10px}
.f-prev{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.f-foot{display:flex;gap:14px;align-items:center;font-size:14px;color:var(--muted)}
.f-like{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;padding:2px 0;display:inline-flex;gap:5px;align-items:center}
.f-like.on{color:#ff5a7a}
.f-reply{margin-left:14px;background:rgba(255,255,255,.06)}
.f-err{color:#ff8a8a;font-size:13px;min-height:16px;margin:0 0 8px}
.f-empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
</style>
</head>
<body>
<div class="bg"></div>

<div class="tabs" id="tabs">
  <button data-v="home" class="on">İndir</button>
  <button data-v="forum">Forum</button>
</div>
<div class="hello" id="hello" hidden></div>

<main id="vHome">
  <p class="brand">Solid OS</p>
  <nav class="dl">
    <a href="https://www.mediafire.com/file/wglmnmpl6qcsxz2/solidos-son.iso/file" target="_blank" rel="noopener">Solid OS – Son</a>
    <a href="https://www.mediafire.com/file/3utibbh9njetnnb/solidos-bilmemkac1.iso/file" target="_blank" rel="noopener">Solid OS 1</a>
    <a href="https://www.mediafire.com/file/fsvwsym5u3uedai/solidos-bilmemkac3.iso/file" target="_blank" rel="noopener">Solid OS 3</a>
    <a href="https://www.mediafire.com/file/2f9man3mjt6spe3/solidos-bilmemkac5_%25281%2529.iso/file" target="_blank" rel="noopener">Solid OS 5</a>
  </nav>
</main>

<section class="forum" id="vForum" hidden>
  <div class="wrap">
    <div id="fList">
      <div class="f-bar"><h2>Forum</h2><button class="f-btn" id="fNew">+ Yeni konu</button></div>
      <div class="f-card" id="fNewBox" hidden>
        <input id="fTitle" placeholder="Konu başlığı" maxlength="120">
        <textarea id="fBody" placeholder="Ne düşünüyorsun?" maxlength="2000" rows="4"></textarea>
        <div class="f-err" id="fErr"></div>
        <button class="f-btn" id="fPost">Paylaş</button>
      </div>
      <div id="fTopics"></div>
    </div>
    <div id="fDetail" hidden>
      <button class="f-link" id="fBack">← Geri</button>
      <div id="fTopicBox"></div>
      <div id="fReplies"></div>
      <div class="f-card">
        <textarea id="fReply" placeholder="Mesaj yaz…" maxlength="1000" rows="3"></textarea>
        <div class="f-err" id="fErr2"></div>
        <button class="f-btn" id="fSend">Gönder</button>
      </div>
    </div>
  </div>
</section>

<div class="picker" id="picker" aria-label="Site rengi"></div>

<div class="modal" id="modal">
  <div class="box">
    <h2>Hoş geldin</h2>
    <p>Devam etmek için adını ve soyadını yaz.</p>
    <input id="ad" placeholder="Ad" autocomplete="given-name">
    <input id="soyad" placeholder="Soyad" autocomplete="family-name">
    <div class="err" id="err"></div>
    <button class="go" id="save">Devam</button>
  </div>
</div>

<script>
(function(){
  var root=document.documentElement;
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function del(k){try{localStorage.removeItem(k)}catch(e){}}

  /* ---- renk ---- */
  var colors=[{n:"Mavi",h:220},{n:"Mor",h:270},{n:"Pembe",h:330},{n:"Kırmızı",h:5},{n:"Turuncu",h:30},{n:"Yeşil",h:145},{n:"Turkuaz",h:185}];
  var mode=get("solid_color")||"auto", hue=220, timer=null;
  function setHue(h){hue=h;root.style.setProperty("--h",h)}
  function apply(){
    clearInterval(timer);
    if(mode==="auto"){timer=setInterval(function(){setHue((hue+0.4)%360)},50)}else{setHue(parseInt(mode,10))}
    document.querySelectorAll(".sw").forEach(function(b){b.classList.toggle("on",b.dataset.v===mode)});
  }
  var picker=document.getElementById("picker");
  var a=document.createElement("button");
  a.className="sw auto";a.dataset.v="auto";a.title="Otomatik";a.setAttribute("aria-label","Otomatik renk");
  a.onclick=function(){mode="auto";set("solid_color",mode);apply()};
  picker.appendChild(a);
  colors.forEach(function(c){
    var b=document.createElement("button");
    b.className="sw";b.dataset.v=String(c.h);b.title=c.n;b.setAttribute("aria-label",c.n);
    b.style.background="hsl("+c.h+" 80% 55%)";
    b.onclick=function(){mode=String(c.h);set("solid_color",mode);apply()};
    picker.appendChild(b);
  });
  apply();

  /* ---- sekmeler (İndir / Forum) ---- */
  var vHome=document.getElementById("vHome"), vForum=document.getElementById("vForum"), tabs=document.getElementById("tabs");
  function showView(v){
    vHome.hidden=v!=="home"; vForum.hidden=v!=="forum";
    tabs.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.v===v)});
  }
  tabs.onclick=function(e){var b=e.target.closest("button");if(b)showView(b.dataset.v)};
  function hashCheck(){if(/^#sx-t\d+$/.test(location.hash))showView("forum")}
  addEventListener("hashchange",hashCheck); hashCheck();

  /* ---- ad soyad ---- */
  var hello=document.getElementById("hello"),modal=document.getElementById("modal");
  function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function syncName(){
    var n=((get("solid_ad")||"")+" "+(get("solid_soyad")||"")).trim().slice(0,30);
    if(!n)return;
    set("sxName",n);
    document.querySelectorAll("[data-r=nAuthor],[data-r=rAuthor]").forEach(function(i){i.value=n});
  }
  function showHello(){
    var ad=get("solid_ad"),soyad=get("solid_soyad");
    if(ad&&soyad){
      hello.hidden=false;
      hello.innerHTML="Merhaba, "+esc(ad)+" "+esc(soyad)+"<button id=\"chg\">Değiştir</button>";
      document.getElementById("chg").onclick=function(){del("solid_ad");del("solid_soyad");hello.hidden=true;openModal()};
      modal.classList.remove("show");
      syncName();
    }else{openModal()}
  }
  function openModal(){modal.classList.add("show");setTimeout(function(){document.getElementById("ad").focus()},50)}
  function save(){
    var ad=document.getElementById("ad").value.trim(), soyad=document.getElementById("soyad").value.trim();
    if(!ad||!soyad){document.getElementById("err").textContent="Ad ve soyad gerekli.";return}
    set("solid_ad",ad);set("solid_soyad",soyad);
    document.getElementById("err").textContent="";
    showHello();
  }
  document.getElementById("save").onclick=save;
  modal.addEventListener("keydown",function(e){if(e.key==="Enter")save()});
  showHello();
})();
</script>


<script>
(function(){
  var SB_URL="https://gnoccttvyehqnghdshie.supabase.co";
  var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdub2NjdHR2eWVocW5naGRzaGllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODUzNzgsImV4cCI6MjEwODE2MTM3OH0.6iVhHw1InirKa3sYQv9cAedj9UTkMAKliIGjRtl67Ec"; // anon (herkese açık) anahtar
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function $(id){return document.getElementById(id)}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

  /* cihaz kimliği (kalp tekrarını önlemek için) */
  var cid=get("solid_cid");
  if(!cid){
    cid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():("c"+Date.now().toString(36)+Math.random().toString(36).slice(2,12));
    set("solid_cid",cid);
  }

  /* isim filtresi: her kelimenin ilk harfi + yıldız. Tam isim veritabanına hiç gitmez. */
  function maskedName(){
    var ad=get("solid_ad"),so=get("solid_soyad");
    if(!ad||!so)return "";
    return (ad+" "+so).trim().split(/\s+/).map(function(w){
      var ch=Array.from(w);return ch[0].toLocaleUpperCase("tr")+"****";
    }).join(" ").slice(0,60);
  }

  function api(path,opt){
    opt=opt||{};
    opt.headers=Object.assign({apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},opt.headers||{});
    return fetch(SB_URL+"/rest/v1/"+path,opt).then(function(r){
      if(!r.ok)return r.json().catch(function(){return{}}).then(function(j){throw new Error(j.message||("Hata "+r.status))});
      return r.text().then(function(t){return t?JSON.parse(t):null});
    });
  }
  function when(x){try{return new Date(x).toLocaleString("tr-TR",{dateStyle:"short",timeStyle:"short"})}catch(e){return ""}}

  var topics=[],liked={},replies=[],cur=null;

  function loadTopics(){
    return Promise.all([
      api("sf_topics?select=*&order=created_at.desc&limit=100"),
      api("sf_likes?select=topic_id&client_id=eq."+encodeURIComponent(cid))
    ]).then(function(r){
      topics=r[0]||[];liked={};(r[1]||[]).forEach(function(l){liked[l.topic_id]=1});
      renderAll();
    }).catch(function(e){
      $("fTopics").innerHTML="";
      $("fTopics").appendChild(el("div","f-empty","Forum yüklenemedi: "+e.message));
    });
  }
  function loadReplies(){
    if(cur==null)return Promise.resolve();
    var id=cur;
    return api("sf_replies?select=*&topic_id=eq."+id+"&order=created_at.asc&limit=500").then(function(r){
      if(cur!==id)return;replies=r||[];renderReplies();
    }).catch(function(){});
  }
  function refresh(){return loadTopics().then(loadReplies)}

  function heart(t){
    var b=el("button","f-like"+(liked[t.id]?" on":""),(liked[t.id]?"♥ ":"♡ ")+t.like_count);
    b.setAttribute("aria-label","Beğen");
    b.onclick=function(e){e.stopPropagation();toggleLike(t)};
    return b;
  }
  function toggleLike(t){
    var url;
    if(liked[t.id]){
      delete liked[t.id];t.like_count=Math.max(0,t.like_count-1);renderAll();
      api("sf_likes?topic_id=eq."+t.id+"&client_id=eq."+encodeURIComponent(cid),{method:"DELETE"}).catch(refresh);
    }else{
      liked[t.id]=1;t.like_count++;renderAll();
      api("sf_likes",{method:"POST",body:JSON.stringify({topic_id:t.id,client_id:cid})}).catch(refresh);
    }
  }

  function renderList(){
    var box=$("fTopics");box.innerHTML="";
    if(!topics.length){box.appendChild(el("div","f-empty","Henüz konu yok. İlk konuyu sen aç!"));return}
    topics.forEach(function(t){
      var c=el("div","f-card click");
      c.appendChild(el("h3","f-title",t.title));
      c.appendChild(el("div","f-meta",t.author+" · "+when(t.created_at)));
      c.appendChild(el("p","f-text f-prev",t.body));
      var f=el("div","f-foot");f.appendChild(heart(t));f.appendChild(el("span","","💬 "+t.reply_count));
      c.appendChild(f);
      c.onclick=function(){openTopic(t.id)};
      box.appendChild(c);
    });
  }
  function renderTopicBox(){
    var t=topics.filter(function(x){return x.id===cur})[0];
    var box=$("fTopicBox");box.innerHTML="";
    if(!t){box.appendChild(el("div","f-empty","Konu bulunamadı."));return}
    var c=el("div","f-card");
    c.appendChild(el("h3","f-title",t.title));
    c.appendChild(el("div","f-meta",t.author+" · "+when(t.created_at)));
    c.appendChild(el("p","f-text",t.body));
    var f=el("div","f-foot");f.appendChild(heart(t));f.appendChild(el("span","","💬 "+t.reply_count));
    c.appendChild(f);box.appendChild(c);
  }
  function renderReplies(){
    var box=$("fReplies");box.innerHTML="";
    replies.forEach(function(r){
      var c=el("div","f-card f-reply");
      c.appendChild(el("div","f-meta",r.author+" · "+when(r.created_at)));
      c.appendChild(el("p","f-text",r.body));
      box.appendChild(c);
    });
  }
  function renderAll(){
    if(cur==null)renderList();else renderTopicBox();
  }

  function openTopic(id){
    cur=id;replies=[];
    $("fList").hidden=true;$("fDetail").hidden=false;
    $("fReply").value="";$("fErr2").textContent="";
    renderTopicBox();renderReplies();loadReplies();
    $("vForum").scrollTop=0;
  }
  function closeTopic(){
    cur=null;$("fDetail").hidden=true;$("fList").hidden=false;
    renderList();loadTopics();
  }
  $("fBack").onclick=closeTopic;

  /* yeni konu */
  $("fNew").onclick=function(){
    var b=$("fNewBox");b.hidden=!b.hidden;
    if(!b.hidden)$("fTitle").focus();
  };
  $("fPost").onclick=function(){
    var title=$("fTitle").value.trim(),body=$("fBody").value.trim(),name=maskedName(),err=$("fErr");
    if(!name){err.textContent="Önce adını ve soyadını gir.";return}
    if(!title||!body){err.textContent="Başlık ve mesaj gerekli.";return}
    err.textContent="";var btn=$("fPost");btn.disabled=true;
    api("sf_topics",{method:"POST",body:JSON.stringify({author:name,title:title,body:body})})
      .then(function(){$("fTitle").value="";$("fBody").value="";$("fNewBox").hidden=true;return loadTopics()})
      .catch(function(e){err.textContent=e.message})
      .then(function(){btn.disabled=false});
  };

  /* cevap yaz */
  $("fSend").onclick=function(){
    var body=$("fReply").value.trim(),name=maskedName(),err=$("fErr2");
    if(!name){err.textContent="Önce adını ve soyadını gir.";return}
    if(!body){err.textContent="Mesaj boş olamaz.";return}
    err.textContent="";var btn=$("fSend");btn.disabled=true;
    api("sf_replies",{method:"POST",body:JSON.stringify({topic_id:cur,author:name,body:body})})
      .then(function(){$("fReply").value="";return refresh()})
      .catch(function(e){err.textContent=e.message})
      .then(function(){btn.disabled=false});
  };

  /* Forum sekmesi açılınca yükle, açıkken 8 sn'de bir yenile */
  $("tabs").addEventListener("click",function(e){
    var b=e.target.closest("button");if(b&&b.dataset.v==="forum")refresh();
  });
  setInterval(function(){
    if(!$("vForum").hidden&&!document.hidden)refresh();
  },8000);
  if(!$("vForum").hidden)refresh();
})();
</script>
</body>
</html>
